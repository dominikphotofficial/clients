
<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DP.PORTFOLIO | KLIENTŲ PORTALAS</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/Xvc3zYGK/dp-logo.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/Xvc3zYGK/dp-logo.png">
    <meta property="og:title" content="DP.PORTFOLIO | KLIENTŲ PORTALAS">
    <meta property="og:description" content="Privati klientų fotosesijų peržiūros erdvė">
    <meta property="og:image" content="https://i.postimg.cc/Xvc3zYGK/dp-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        #authView {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            min-height: 85vh;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: clamp(35px, 6vw, 55px) clamp(22px, 5vw, 40px);
            text-align: center;
            box-shadow: 0 15px 50px rgba(17, 57, 57, 0.03);
        }

        .auth-card-logo {
            height: 32px;
            width: auto;
            margin: 0 auto 25px auto;
            display: block;
        }

        .auth-tagline {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-light);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .auth-title {
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: clamp(1.4rem, 4vw, 1.9rem);
            font-weight: 400;
            margin-bottom: 28px;
        }

        .pin-inputs {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 2vw, 12px);
            margin-bottom: 25px;
        }

        .pin-cell {
            width: clamp(42px, 12vw, 54px);
            height: clamp(52px, 15vw, 64px);
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            font-family: var(--font-heading);
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            text-align: center;
            color: var(--text-color);
            outline: none;
            transition: var(--transition);
        }

        .pin-cell:focus {
            border-color: var(--accent-color);
            background: #FFFFFF;
            box-shadow: 0 0 0 1px var(--accent-color);
        }

        .auth-error {
            color: var(--danger-color);
            font-size: 0.75rem;
            letter-spacing: 1px;
            margin-top: 15px;
            display: none;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="header-brand">
            <img src="https://i.postimg.cc/Xvc3zYGK/dp-logo.png" alt="DP.PORTFOLIO" class="header-logo">
            <span class="header-title-badge">KLIENTŲ PORTALAS</span>
        </a>
    </header>

    <main id="authView">
        <div class="auth-card">
            <img src="https://i.postimg.cc/Xvc3zYGK/dp-logo.png" alt="DP.PORTFOLIO" class="auth-card-logo">
            <div class="auth-tagline">Klientų Erdvė</div>
            <h1 class="auth-title">Įveskite PIN</h1>

            <div class="pin-inputs" id="pinGroup">
                <input type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="pin-cell" autofocus autocomplete="off">
                <input type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="pin-cell" autocomplete="off">
                <input type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="pin-cell" autocomplete="off">
                <input type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="pin-cell" autocomplete="off">
                <input type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="pin-cell" autocomplete="off">
                <input type="tel" maxlength="1" pattern="[0-9]*" inputmode="numeric" class="pin-cell" autocomplete="off">
            </div>

            <button id="submitPinBtn" class="btn-primary">
                <span>Atidaryti Galeriją</span>
            </button>

            <p id="errorMsg" class="auth-error"></p>
        </div>
    </main>

    <footer>
        <p>DP.PORTFOLIO &copy; 2026. Visos teisės saugomos.</p>
    </footer>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const cells = Array.from(document.querySelectorAll('.pin-cell'));
        const submitBtn = document.getElementById('submitPinBtn');
        const errorMsg = document.getElementById('errorMsg');

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const directPin = urlParams.get('pin') || window.location.hash.replace('#', '');

            if (directPin && directPin.length === 6) {
                directPin.split('').forEach((digit, i) => {
                    if (cells[i]) cells[i].value = digit;
                });
                window.history.replaceState({}, document.title, window.location.pathname);
                await verifyPin();
            }
        });

        cells.forEach((cell, idx) => {
            cell.addEventListener('input', (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = val;

                if (val && idx < cells.length - 1) {
                    cells[idx + 1].focus();
                }

                if (getPin().length === 6) {
                    verifyPin();
                }
            });

            cell.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !cell.value && idx > 0) {
                    cells[idx - 1].focus();
                } else if (e.key === 'Enter') {
                    verifyPin();
                }
            });

            cell.addEventListener('paste', (e) => {
                e.preventDefault();
                const pasteData = (e.clipboardData || window.clipboardData).getData('text').trim().replace(/[^0-9]/g, '');
                if (!pasteData) return;

                pasteData.split('').slice(0, 6).forEach((char, i) => {
                    if (cells[i]) cells[i].value = char;
                });

                const focusIndex = Math.min(pasteData.length, 5);
                cells[focusIndex].focus();

                if (pasteData.length >= 6) {
                    verifyPin();
                }
            });
        });

        submitBtn.addEventListener('click', verifyPin);

        function getPin() {
            return cells.map(c => c.value).join('');
        }

        async function verifyPin() {
            const pin = getPin();
            if (pin.length !== 6) {
                showError('Įveskite visus 6 skaitmenis');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.querySelector('span').innerText = 'Tikrinama...';
            errorMsg.style.display = 'none';

            try {
                const q = query(collection(db, "galleries"), where("pin", "==", pin));
                const snap = await getDocs(q);

                if (!snap.empty) {
                    const galleryData = snap.docs[0].data();
                    sessionStorage.setItem('clientGallery', JSON.stringify(galleryData));
                    window.location.replace('gallery.html');
                } else {
                    showError('Neteisingas PIN kodas');
                    clearInputs();
                }
            } catch (err) {
                showError('Sistemos klaida. Bandykite vėliau.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.querySelector('span').innerText = 'Atidaryti Galeriją';
            }
        }

        function showError(msg) {
            errorMsg.innerText = msg;
            errorMsg.style.display = 'block';
            setTimeout(() => {
                errorMsg.style.display = 'none';
            }, 4000);
        }

        function clearInputs() {
            cells.forEach(c => c.value = '');
            cells[0].focus();
        }
    </script>
</body>
</html>
