<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DP.PORTFOLIO — Klientų prisijungimas</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FBF9F6;
            --accent-color: #113939;
            --text-color: #1A2B2B;
            --font-heading: 'Jost', sans-serif;
            --font-body: 'Josefin Sans', sans-serif;
            --cb: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #preloader {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        .loader {
            width: 40px;
            height: 40px;
            border: 2px solid rgba(17, 57, 57, 0.1);
            border-top: 2px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .login-card {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
            opacity: 0;
            transform: translateY(30px);
            transition: all 1s var(--cb);
        }

        .login-card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .login-card h2 {
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 8px;
            font-size: 0.9rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .login-card h1 {
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 2.2rem;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .pin-input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(17, 57, 57, 0.2);
            font-family: var(--font-body);
            font-size: 2.5rem;
            color: var(--text-color);
            text-align: center;
            letter-spacing: 15px;
            outline: none;
            padding: 10px 0;
            margin-bottom: 40px;
            transition: border-color 0.4s var(--cb);
        }

        .pin-input:focus {
            border-bottom-color: var(--accent-color);
        }

        .cta-button {
            width: 100%;
            padding: 20px;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.6s var(--cb);
        }

        .cta-button:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .error-message {
            color: #8b0000;
            font-size: 0.75rem;
            margin-top: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: none;
        }

        .footer-logo {
            position: absolute;
            bottom: 40px;
            width: 100%;
            text-align: center;
            font-family: var(--font-heading);
            letter-spacing: 3px;
            font-size: 0.8rem;
            opacity: 0.6;
            text-transform: uppercase;
            font-weight: 400;
        }
    </style>
</head>
<body>

    <div id="preloader"><div class="loader"></div></div>

    <main class="login-card" id="loginContent">
        <h2>Klientų zona</h2>
        <h1>Įveskite PIN</h1>
        
        <input type="text" id="pinInput" class="pin-input" placeholder="000000" maxlength="6" autocomplete="off">
        <button id="accessBtn" class="cta-button">Atidaryti galeriją</button>
        <p id="errorBox" class="error-message"></p>
    </main>

    <div class="footer-logo">DP.PORTFOLIO</div>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        window.addEventListener('load', () => {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => preloader.style.display = 'none', 500);
            document.getElementById('loginContent').classList.add('visible');
        });

        const pinInput = document.getElementById('pinInput');
        const accessBtn = document.getElementById('accessBtn');
        const errorBox = document.getElementById('errorBox');

        accessBtn.addEventListener('click', async () => {
            const pinValue = pinInput.value.trim();
            
            if (pinValue.length !== 6) {
                showError("Įveskite 6 skaitmenų kodą");
                return;
            }

            accessBtn.innerText = "Tikrinama...";
            accessBtn.style.pointerEvents = "none";

            try {
                const q = query(collection(db, "galleries"), where("pin", "==", pinValue));
                const querySnapshot = await getDocs(q);

                if (!querySnapshot.empty) {
                    const galleryData = querySnapshot.docs[0].data();
                    sessionStorage.setItem('clientGallery', JSON.stringify(galleryData));
                    window.location.href = 'gallery.html';
                } else {
                    showError("Neteisingas PIN kodas");
                }
            } catch (error) {
                showError("Sistemos klaida. Bandykite vėliau.");
            } finally {
                accessBtn.innerText = "Atidaryti galeriją";
                accessBtn.style.pointerEvents = "auto";
            }
        });

        function showError(msg) {
            errorBox.innerText = msg;
            errorBox.style.display = 'block';
            setTimeout(() => { errorBox.style.display = 'none'; }, 4000);
        }

        pinInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') accessBtn.click();
        });
    </script>
</body>
</html>
