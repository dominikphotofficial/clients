<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>Admin — DP.PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #FBF9F6; --accent: #113939; --font: 'Jost', sans-serif; }
        body { background: var(--bg); font-family: 'Josefin Sans', sans-serif; padding: 50px; }
        .admin-card { max-width: 600px; margin: 0 auto; background: white; padding: 40px; border: 1px solid rgba(0,0,0,0.05); }
        h1 { font-family: var(--font); text-transform: uppercase; letter-spacing: 4px; font-size: 1.5rem; margin-bottom: 30px; text-align: center; }
        .form-input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; outline: none; }
        .btn { width: 100%; padding: 15px; background: var(--accent); color: white; border: none; text-transform: uppercase; letter-spacing: 2px; cursor: pointer; }
        .upload-zone { border: 2px dashed #ccc; padding: 30px; text-align: center; margin-bottom: 20px; cursor: pointer; }
        .hidden { display: none; }
        #status { margin-top: 20px; font-size: 0.9rem; color: var(--accent); text-align: center; }
    </style>
</head>
<body>
    <div id="authPanel" class="admin-card">
        <h1>Admin Prisijungimas</h1>
        <input type="email" id="email" class="form-input" placeholder="El. paštas">
        <input type="password" id="pass" class="form-input" placeholder="Slaptažodis">
        <button id="loginBtn" class="btn">Prisijungti</button>
    </div>

    <div id="dash" class="admin-card hidden">
        <h1>Nauja Galerija</h1>
        <input type="text" id="title" class="form-input" placeholder="Galerijos pavadinimas">
        <input type="text" id="subtitle" class="form-input" placeholder="Potėmė / Kategorija">
        <input type="text" id="pin" class="form-input" placeholder="PIN (6 skaitmenys)" maxlength="6">
        <input type="url" id="zip" class="form-input" placeholder="ZIP nuoroda (nebūtina)">
        
        <div class="upload-zone" id="drop">Spauskite arba įkelkite nuotraukas</div>
        <input type="file" id="files" multiple class="hidden">
        
        <button id="saveBtn" class="btn">Sukurti galeriją</button>
        <div id="status"></div>
    </div>

    <script type="module">
        import { auth, db, storage } from './firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const drop = document.getElementById('drop');
        const filesInput = document.getElementById('files');
        let selectedFiles = [];

        document.getElementById('loginBtn').onclick = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value)
                .catch(() => alert("Klaida"));
        };

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === 'dominikphotofficial.lt@gmail.com') {
                document.getElementById('authPanel').classList.add('hidden');
                document.getElementById('dash').classList.remove('hidden');
            }
        });

        drop.onclick = () => filesInput.click();
        filesInput.onchange = (e) => {
            selectedFiles = [...e.target.files];
            drop.innerText = `Pasirinkta nuotraukų: ${selectedFiles.length}`;
        };

        document.getElementById('saveBtn').onclick = async () => {
            const status = document.getElementById('status');
            const pin = document.getElementById('pin').value;
            const photos = [];

            if (selectedFiles.length === 0 || pin.length !== 6) return alert("Užpildykite duomenis");

            document.getElementById('saveBtn').disabled = true;

            for (let file of selectedFiles) {
                status.innerText = `Kelama: ${file.name}`;
                const sRef = ref(storage, `galleries/${pin}/${file.name}`);
                await uploadBytes(sRef, file);
                const url = await getDownloadURL(sRef);
                photos.push({ thumb: url, full: url });
            }

            await addDoc(collection(db, "galleries"), {
                title: document.getElementById('title').value,
                subtitle: document.getElementById('subtitle').value,
                pin: pin,
                zip_url: document.getElementById('zip').value,
                photos: photos,
                date: new Date().toISOString()
            });

            alert("Galerija sukurta!");
            location.reload();
        };
    </script>
</body>
</html>
