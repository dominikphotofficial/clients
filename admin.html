<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galerija — DP.PORTFOLIO</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/Xvc3zYGK/dp-logo.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/Xvc3zYGK/dp-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F8F7F4;
            --surface-color: #FFFFFF;
            --secondary-color: #D4C3B3;
            --accent-color: #113939;
            --accent-light: #2A5C5C;
            --accent-soft: rgba(17, 57, 57, 0.05);
            --text-color: #1A2B2B;
            --text-muted: rgba(26, 43, 43, 0.6);
            --border-color: rgba(17, 57, 57, 0.1);
            --danger-color: #9e2a2b;
            --font-heading: 'Jost', sans-serif;
            --font-body: 'Josefin Sans', sans-serif;
            --radius: 2px;
            --cb: cubic-bezier(0.16, 1, 0.3, 1);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 16px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(248, 247, 244, 0.95);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .header-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .header-logo img {
            height: clamp(24px, 4vw, 32px);
            width: auto;
            display: block;
            transition: transform 0.3s var(--cb), opacity 0.3s var(--cb);
        }

        .header-logo img:hover {
            opacity: 0.8;
            transform: scale(1.03);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 18px;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            text-decoration: none;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--radius);
        }

        .btn-action svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .btn-action:hover {
            background: var(--accent-color);
            color: #FFFFFF;
        }

        .btn-exit {
            border-color: var(--border-color);
            color: var(--text-muted);
            padding: 9px 12px;
        }

        .btn-exit:hover {
            background: rgba(17, 57, 57, 0.08);
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .container {
            max-width: 1700px;
            margin: 0 auto;
            padding: clamp(100px, 12vw, 140px) 4vw 80px 4vw;
        }

        .hero-info {
            text-align: center;
            max-width: 900px;
            margin: 0 auto 40px auto;
        }

        .hero-meta-badge {
            display: inline-block;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-light);
            margin-bottom: 12px;
            background: var(--accent-soft);
            padding: 4px 12px;
        }

        .gallery-heading {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 3.6rem);
            text-transform: uppercase;
            letter-spacing: 5px;
            font-weight: 300;
            line-height: 1.15;
            margin-bottom: 10px;
        }

        .gallery-category {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 400;
        }

        .divider {
            width: 45px;
            height: 1px;
            background-color: var(--accent-color);
            margin: 25px auto 0 auto;
        }

        .story-card {
            max-width: 850px;
            margin: 0 auto 45px auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: clamp(25px, 5vw, 45px);
            text-align: center;
            box-shadow: 0 10px 40px rgba(17, 57, 57, 0.02);
            border-radius: var(--radius);
        }

        .story-content {
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            line-height: 1.8;
            color: var(--text-color);
            white-space: pre-line;
            font-weight: 300;
        }

        .story-signature {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-top: 25px;
            font-weight: 500;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
        }

        .filter-tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-tab-btn.active {
            color: var(--accent-color);
            font-weight: 600;
            background: var(--accent-soft);
        }

        .btn-copy-favs {
            display: none;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 14px;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-copy-favs:hover {
            background: var(--accent-color);
            color: #FFFFFF;
        }

        .gallery-masonry {
            column-count: 3;
            column-gap: 20px;
            padding-bottom: 60px;
        }

        .photo-card {
            position: relative;
            break-inside: avoid;
            margin-bottom: 20px;
            cursor: pointer;
            overflow: hidden;
            background: #e8e6e3;
            border-radius: var(--radius);
            box-shadow: 0 8px 25px rgba(17, 57, 57, 0.03);
        }

        .photo-card img {
            width: 100%;
            display: block;
            transition: transform 0.8s var(--cb);
        }

        .photo-hover-overlay {
            position: absolute;
            inset: 0;
            background: rgba(17, 57, 57, 0.35);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s var(--cb);
        }

        .photo-hover-overlay svg {
            width: 32px;
            height: 32px;
            fill: #FFFFFF;
            transform: scale(0.8);
            transition: transform 0.3s var(--cb);
        }

        .fav-heart-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.85);
            border: none;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .fav-heart-btn svg {
            width: 18px;
            height: 18px;
            fill: #777;
            transition: fill 0.2s ease;
        }

        .fav-heart-btn.active svg {
            fill: var(--danger-color);
        }

        .fav-heart-btn:hover {
            transform: scale(1.1);
            background: #FFFFFF;
        }

        .photo-card:hover img {
            transform: scale(1.03);
        }

        .photo-card:hover .photo-hover-overlay {
            opacity: 1;
        }

        .photo-card:hover .photo-hover-overlay svg {
            transform: scale(1);
        }

        .review-box {
            max-width: 680px;
            margin: 40px auto 0 auto;
            background: var(--surface-color);
            padding: clamp(30px, 5vw, 55px);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(17, 57, 57, 0.03);
            border-radius: var(--radius);
        }

        .review-box h2 {
            text-align: center;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .form-row {
            margin-bottom: 20px;
        }

        .label-text {
            display: block;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 6px;
        }

        .input-control {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(17, 57, 57, 0.2);
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s var(--cb);
        }

        .input-control:focus {
            border-bottom-color: var(--accent-color);
        }

        .stars-container {
            display: flex;
            gap: 6px;
            cursor: pointer;
            margin-top: 6px;
        }

        .stars-container svg {
            width: 26px;
            height: 26px;
            fill: #d5d0c8;
            transition: fill 0.2s ease, transform 0.2s ease;
        }

        .stars-container svg.active,
        .stars-container svg.hover {
            fill: #d4af37;
        }

        .stars-container svg:hover {
            transform: scale(1.15);
        }

        .btn-send-review {
            width: 100%;
            margin-top: 15px;
            padding: 16px;
            background: var(--accent-color);
            color: #FFFFFF;
            border: 1px solid var(--accent-color);
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-send-review:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
        }

        .lightbox-modal {
            position: fixed;
            inset: 0;
            background: rgba(8, 12, 12, 0.98);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s var(--cb);
        }

        .lightbox-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-top {
            position: absolute;
            top: 20px;
            left: 25px;
            right: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #FFFFFF;
            z-index: 2002;
        }

        .lightbox-idx {
            font-family: var(--font-heading);
            letter-spacing: 3px;
            font-size: 0.85rem;
            opacity: 0.85;
        }

        .lightbox-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .lb-btn {
            background: none;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, opacity 0.2s ease;
            text-decoration: none;
        }

        .lb-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .lb-btn.heart-active svg {
            fill: var(--danger-color);
        }

        .lb-btn:hover {
            opacity: 0.7;
            transform: scale(1.1);
        }

        .lb-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            padding: 20px;
            z-index: 2002;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .lb-nav svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
        }

        .lb-nav:hover {
            opacity: 0.7;
            transform: translateY(-50%) scale(1.1);
        }

        .lb-nav.prev { left: 10px; }
        .lb-nav.next { right: 10px; }

        .lb-stage {
            max-width: 92vw;
            max-height: 88vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .lb-stage img {
            max-width: 100%;
            max-height: 88vh;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
            transition: opacity 0.2s var(--cb);
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-color);
            margin-top: 40px;
        }

        footer p {
            font-family: var(--font-heading);
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        @media (max-width: 1024px) {
            .gallery-masonry {
                column-count: 2;
                column-gap: 15px;
            }
            .photo-card {
                margin-bottom: 15px;
            }
        }

        @media (max-width: 640px) {
            header {
                padding: 12px 16px;
            }
            .btn-action span {
                display: none;
            }
            .btn-action {
                padding: 8px 10px;
            }
            .gallery-masonry {
                column-count: 1;
            }
            .lb-nav.prev { left: 2px; }
            .lb-nav.next { right: 2px; }
            .lb-nav { padding: 10px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="header-logo">
            <img src="https://i.postimg.cc/Xvc3zYGK/dp-logo.png" alt="DP.PORTFOLIO">
        </a>
        <div class="header-actions">
            <a id="downloadArchiveBtn" href="#" class="btn-action" style="display: none;" target="_blank" download>
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                <span>Atsisiųsti viską (.zip)</span>
            </a>
            <button id="logoutGalleryBtn" class="btn-action btn-exit" title="Išeiti">
                <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.89-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="hero-info">
            <div class="hero-meta-badge" id="heroBadge">Kliento Galerija</div>
            <h1 class="gallery-heading" id="galleryTitleName">Kraunama...</h1>
            <p class="gallery-category" id="galleryCategoryName"></p>
            <div class="divider"></div>
        </section>

        <section class="story-card" id="storyBox" style="display: none;">
            <div class="story-content" id="storyText"></div>
            <div class="story-signature">DP.PORTFOLIO</div>
        </section>

        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab-btn active" id="tabAll">Visi kadrai (<span id="countAll">0</span>)</button>
                <button class="filter-tab-btn" id="tabFavs">Mėgstamiausi (<span id="countFavs">0</span>)</button>
            </div>
            <button class="btn-copy-favs" id="copyFavsBtn">
                <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                <span>Kopijuoti atrinktų sąrašą</span>
            </button>
        </div>

        <section class="gallery-masonry" id="photosGrid"></section>

        <section class="review-box">
            <h2>Palikite atsiliepimą</h2>
            <form id="clientReviewForm">
                <div class="form-row">
                    <label class="label-text">Jūsų vardas</label>
                    <input type="text" id="rName" class="input-control" placeholder="Vardas Pavardė" required>
                </div>

                <div class="form-row">
                    <label class="label-text">Įvertinimas</label>
                    <div class="stars-container" id="starsWrapper">
                        <svg data-rate="1" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-rate="2" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-rate="3" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-rate="4" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-rate="5" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </div>
                </div>

                <div class="form-row">
                    <label class="label-text">Atsiliepimas</label>
                    <textarea id="rComment" class="input-control" rows="3" placeholder="Pasidalinkite savo įspūdžiais apie fotosesiją..." required></textarea>
                </div>

                <button type="submit" id="rSubmitBtn" class="btn-send-review">
                    <span>Išsiųsti atsiliepimą</span>
                </button>
            </form>

            <div id="reviewDoneBox" style="display:none; text-align:center; padding:20px 0;">
                <h3 style="font-family:var(--font-heading); text-transform:uppercase; letter-spacing:2px; margin-bottom:8px;">Ačiū už jūsų įvertinimą!</h3>
                <p style="font-size:0.9rem; color:var(--text-muted);">Atsiliepimas sėkmingai išsiųstas.</p>
            </div>
        </section>
    </main>

    <div class="lightbox-modal" id="lbModal">
        <div class="lightbox-top">
            <span class="lightbox-idx" id="lbCounterText">1 / 1</span>
            <div class="lightbox-actions">
                <button class="lb-btn" id="lbHeartBtn" title="Pažymėti širdele">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
                <a href="#" id="lbDownloadBtn" class="lb-btn" title="Atsisiųsti nuotrauką" target="_blank" download>
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </a>
                <button class="lb-btn" id="lbCloseButton" title="Uždaryti">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
        </div>

        <button class="lb-nav prev" id="lbLeftBtn">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <div class="lb-stage">
            <img src="" id="lbDisplayImg" alt="Nuotrauka">
        </div>

        <button class="lb-nav next" id="lbRightBtn">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <footer>
        <p>DP.PORTFOLIO &copy; 2026. Visos teisės saugomos.</p>
    </footer>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const raw = sessionStorage.getItem('clientGallery');
        if (!raw) {
            window.location.replace('index.html');
        }

        const data = JSON.parse(raw);
        const galleryKey = `favs_${data.pin || 'default'}`;
        let favorites = JSON.parse(localStorage.getItem(galleryKey) || '[]');
        let currentFilter = 'all';

        document.getElementById('galleryTitleName').innerText = data.title || 'Galerija';
        document.getElementById('galleryCategoryName').innerText = data.subtitle || '';

        const photos = data.photos || [];
        const dateStr = data.date ? new Date(data.date).toLocaleDateString('lt-LT') : '';
        document.getElementById('heroBadge').innerText = `${photos.length} KADRŲ ${dateStr ? '• ' + dateStr : ''}`;

        if (data.description && data.description.trim()) {
            document.getElementById('storyText').innerText = data.description;
            document.getElementById('storyBox').style.display = 'block';
        }

        const zipBtn = document.getElementById('downloadArchiveBtn');
        if (data.zip_url) {
            zipBtn.href = data.zip_url;
            zipBtn.style.display = 'inline-flex';
        }

        document.getElementById('logoutGalleryBtn').addEventListener('click', () => {
            sessionStorage.removeItem('clientGallery');
            window.location.replace('index.html');
        });

        const grid = document.getElementById('photosGrid');
        const countAll = document.getElementById('countAll');
        const countFavs = document.getElementById('countFavs');
        const tabAll = document.getElementById('tabAll');
        const tabFavs = document.getElementById('tabFavs');
        const copyFavsBtn = document.getElementById('copyFavsBtn');

        countAll.innerText = photos.length;
        countFavs.innerText = favorites.length;

        function updateFavoritesBadge() {
            countFavs.innerText = favorites.length;
            localStorage.setItem(galleryKey, JSON.stringify(favorites));
            copyFavsBtn.style.display = favorites.length > 0 ? 'inline-flex' : 'none';
        }

        updateFavoritesBadge();

        tabAll.addEventListener('click', () => {
            currentFilter = 'all';
            tabAll.classList.add('active');
            tabFavs.classList.remove('active');
            renderGrid();
        });

        tabFavs.addEventListener('click', () => {
            currentFilter = 'favs';
            tabFavs.classList.add('active');
            tabAll.classList.remove('active');
            renderGrid();
        });

        copyFavsBtn.addEventListener('click', () => {
            if (favorites.length === 0) return;
            const text = `Kliento atrinkti kadrai (${data.title}):\n` + favorites.map((f, i) => `${i + 1}. ${f}`).join('\n');
            navigator.clipboard.writeText(text);
            alert(`Atrinktų nuotraukų sąrašas nukopijuotas (${favorites.length} vnt.)!`);
        });

        let activeDisplayPhotos = [];
        let currentIdx = 0;

        function renderGrid() {
            grid.innerHTML = '';
            activeDisplayPhotos = currentFilter === 'all' 
                ? photos 
                : photos.filter(p => favorites.includes(p.full || p.thumb));

            if (activeDisplayPhotos.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:50px; opacity:0.5; text-transform:uppercase; letter-spacing:2px;">Mėgstamiausių nuotraukų kol kas nėra</p>';
                return;
            }

            activeDisplayPhotos.forEach((p, idx) => {
                const isFav = favorites.includes(p.full || p.thumb);
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <button class="fav-heart-btn ${isFav ? 'active' : ''}" title="Mėgstamiausia">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                    <img src="${p.thumb}" loading="lazy" alt="Kadras">
                    <div class="photo-hover-overlay">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                `;

                card.querySelector('.fav-heart-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(p.full || p.thumb);
                });

                card.addEventListener('click', () => showLightbox(idx));
                grid.appendChild(card);
            });
        }

        function toggleFavorite(photoUrl) {
            if (favorites.includes(photoUrl)) {
                favorites = favorites.filter(u => u !== photoUrl);
            } else {
                favorites.push(photoUrl);
            }
            updateFavoritesBadge();
            renderGrid();
            updateLightboxHeart();
        }

        renderGrid();

        const lbModal = document.getElementById('lbModal');
        const lbDisplayImg = document.getElementById('lbDisplayImg');
        const lbCounterText = document.getElementById('lbCounterText');
        const lbDownloadBtn = document.getElementById('lbDownloadBtn');
        const lbHeartBtn = document.getElementById('lbHeartBtn');
        const lbCloseButton = document.getElementById('lbCloseButton');
        const lbLeftBtn = document.getElementById('lbLeftBtn');
        const lbRightBtn = document.getElementById('lbRightBtn');

        function showLightbox(idx) {
            currentIdx = idx;
            renderLightbox();
            lbModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hideLightbox() {
            lbModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function renderLightbox() {
            const p = activeDisplayPhotos[currentIdx];
            if (!p) return;

            lbCounterText.innerText = `${currentIdx + 1} / ${activeDisplayPhotos.length}`;
            lbDownloadBtn.href = p.full || p.thumb;
            updateLightboxHeart();

            lbDisplayImg.style.opacity = '0';
            const cacheImg = new Image();
            cacheImg.src = p.full || p.thumb;
            cacheImg.onload = () => {
                lbDisplayImg.src = cacheImg.src;
                lbDisplayImg.style.opacity = '1';
            };
        }

        function updateLightboxHeart() {
            const p = activeDisplayPhotos[currentIdx];
            if (!p) return;
            const isFav = favorites.includes(p.full || p.thumb);
            lbHeartBtn.classList.toggle('heart-active', isFav);
        }

        lbHeartBtn.addEventListener('click', () => {
            const p = activeDisplayPhotos[currentIdx];
            if (p) toggleFavorite(p.full || p.thumb);
        });

        function nextPhoto() {
            if (!activeDisplayPhotos.length) return;
            currentIdx = (currentIdx + 1) % activeDisplayPhotos.length;
            renderLightbox();
        }

        function prevPhoto() {
            if (!activeDisplayPhotos.length) return;
            currentIdx = (currentIdx - 1 + activeDisplayPhotos.length) % activeDisplayPhotos.length;
            renderLightbox();
        }

        lbCloseButton.addEventListener('click', hideLightbox);
        lbRightBtn.addEventListener('click', nextPhoto);
        lbLeftBtn.addEventListener('click', prevPhoto);

        lbModal.addEventListener('click', (e) => {
            if (e.target === lbModal || e.target.classList.contains('lb-stage')) {
                hideLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!lbModal.classList.contains('active')) return;
            if (e.key === 'Escape') hideLightbox();
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft') prevPhoto();
        });

        let currentRate = 5;
        const starNodes = document.querySelectorAll('#starsWrapper svg');

        starNodes.forEach((s) => {
            s.addEventListener('mouseenter', () => {
                const r = parseInt(s.dataset.rate);
                starNodes.forEach(node => {
                    node.classList.toggle('hover', parseInt(node.dataset.rate) <= r);
                });
            });

            s.addEventListener('mouseleave', () => {
                starNodes.forEach(node => node.classList.remove('hover'));
            });

            s.addEventListener('click', () => {
                currentRate = parseInt(s.dataset.rate);
                starNodes.forEach(node => {
                    node.classList.toggle('active', parseInt(node.dataset.rate) <= currentRate);
                });
            });
        });

        const reviewForm = document.getElementById('clientReviewForm');
        const rSubmitBtn = document.getElementById('rSubmitBtn');
        const reviewDoneBox = document.getElementById('reviewDoneBox');

        reviewForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('rName').value.trim();
            const text = document.getElementById('rComment').value.trim();

            if (!name || !text) return;

            rSubmitBtn.disabled = true;
            rSubmitBtn.querySelector('span').innerText = 'Siunčiama...';

            try {
                await addDoc(collection(db, "reviews"), {
                    galleryTitle: data.title || '',
                    name: name,
                    rating: currentRate,
                    text: text,
                    status: 'pending',
                    date: new Date().toISOString()
                });

                reviewForm.style.display = 'none';
                reviewDoneBox.style.display = 'block';
            } catch (err) {
                alert('Klaida siunčiant atsiliepimą.');
                rSubmitBtn.disabled = false;
                rSubmitBtn.querySelector('span').innerText = 'Išsiųsti atsiliepimą';
            }
        });
    </script>
</body>
</html>
