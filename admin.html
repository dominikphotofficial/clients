<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valdymo Skydelis — DP.PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FBF9F6;
            --surface-color: #FFFFFF;
            --accent-color: #113939;
            --accent-light: #2A5C5C;
            --text-color: #1A2B2B;
            --border-color: rgba(17, 57, 57, 0.1);
            --danger-color: #9e2a2b;
            --font-heading: 'Jost', sans-serif;
            --font-body: 'Josefin Sans', sans-serif;
            --cb: cubic-bezier(0.16, 1, 0.3, 1);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 18px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background: rgba(251, 249, 246, 0.96);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }

        .header-logo img {
            height: 28px;
            width: auto;
        }

        .admin-badge {
            font-family: var(--font-heading);
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: rgba(17, 57, 57, 0.08);
            color: var(--accent-color);
            padding: 3px 8px;
            border-radius: 2px;
        }

        .admin-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-email {
            font-size: 0.85rem;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 18px;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-logout:hover {
            background: var(--danger-color);
            color: #FFFFFF;
            border-color: var(--danger-color);
        }

        main {
            flex: 1;
            padding: 40px 5vw 80px 5vw;
            max-width: 1500px;
            width: 100%;
            margin: 0 auto;
        }

        .auth-container {
            max-width: 450px;
            margin: 80px auto;
            background: var(--surface-color);
            padding: 45px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(17, 57, 57, 0.03);
            text-align: center;
        }

        .auth-container h1 {
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 1.6rem;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .tabs-header {
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 35px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 15px 25px;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: rgba(26, 43, 43, 0.5);
            cursor: pointer;
            position: relative;
            transition: color 0.3s var(--cb);
        }

        .tab-btn.active {
            color: var(--accent-color);
            font-weight: 500;
        }

        .tab-btn.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-color);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background: var(--surface-color);
            padding: 25px;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 8px;
        }

        .stat-value {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 500;
            color: var(--accent-color);
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            padding: 12px 18px;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            font-family: var(--font-body);
            font-size: 0.95rem;
            width: 320px;
            outline: none;
            transition: border-color 0.3s var(--cb);
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .gallery-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .gallery-row {
            display: grid;
            grid-template-columns: 80px 1.5fr 1fr 120px 140px 160px;
            align-items: center;
            gap: 20px;
            background: var(--surface-color);
            padding: 15px 25px;
            border: 1px solid var(--border-color);
            transition: box-shadow 0.3s var(--cb), transform 0.3s var(--cb);
        }

        .gallery-row:hover {
            box-shadow: 0 8px 25px rgba(17, 57, 57, 0.05);
            transform: translateY(-2px);
        }

        .gallery-thumb {
            width: 80px;
            height: 55px;
            object-fit: cover;
            background: #e8e6e3;
        }

        .gallery-info h3 {
            font-family: var(--font-heading);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
            margin-bottom: 4px;
        }

        .gallery-info p {
            font-size: 0.8rem;
            letter-spacing: 1px;
            opacity: 0.6;
            text-transform: uppercase;
        }

        .pin-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(17, 57, 57, 0.06);
            padding: 6px 12px;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 3px;
            font-weight: 500;
            color: var(--accent-color);
            cursor: pointer;
            width: fit-content;
        }

        .pin-pill:hover {
            background: rgba(17, 57, 57, 0.12);
        }

        .meta-text {
            font-size: 0.85rem;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .row-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
        }

        .action-icon-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
        }

        .action-icon-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .action-icon-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            border-color: var(--accent-color);
        }

        .action-icon-btn.btn-delete:hover {
            background: var(--danger-color);
            color: #FFFFFF;
            border-color: var(--danger-color);
        }

        .form-card {
            max-width: 700px;
            background: var(--surface-color);
            padding: 45px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(17, 57, 57, 0.03);
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-label {
            display: block;
            font-family: var(--font-heading);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 2px;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 13px 15px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s var(--cb);
        }

        .form-input:focus {
            border-color: var(--accent-color);
        }

        .drop-zone {
            border: 2px dashed var(--accent-color);
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(17, 57, 57, 0.02);
            transition: background 0.3s var(--cb);
        }

        .drop-zone.dragover {
            background: rgba(17, 57, 57, 0.08);
        }

        .drop-zone p {
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.85rem;
            color: var(--accent-color);
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
            gap: 8px;
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }

        .preview-grid img {
            width: 100%;
            height: 70px;
            object-fit: cover;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--accent-color);
            color: var(--bg-color);
            border: 1px solid var(--accent-color);
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
        }

        .progress-box {
            margin-top: 20px;
            display: none;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: var(--border-color);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-color);
            transition: width 0.2s ease;
        }

        .progress-text {
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-align: center;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .reviews-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .review-card {
            background: var(--surface-color);
            padding: 25px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .review-author {
            font-family: var(--font-heading);
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 500;
        }

        .review-gallery {
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-light);
            margin-bottom: 15px;
        }

        .review-stars {
            color: #d4af37;
            letter-spacing: 2px;
            font-size: 0.9rem;
        }

        .review-body {
            font-size: 0.95rem;
            line-height: 1.6;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .review-date {
            font-size: 0.75rem;
            letter-spacing: 1px;
            opacity: 0.5;
            text-transform: uppercase;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 1024px) {
            .gallery-row {
                grid-template-columns: 70px 1fr 1fr;
                gap: 15px;
            }
            .gallery-row .pin-pill,
            .gallery-row .meta-text {
                display: none;
            }
        }

        @media (max-width: 650px) {
            main {
                padding: 20px 15px;
            }
            .gallery-row {
                grid-template-columns: 60px 1fr auto;
                padding: 12px 15px;
            }
            .search-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-logo">
            <img src="https://i.postimg.cc/Xvc3zYGK/dp-logo.png" alt="DP.PORTFOLIO">
            <span class="admin-badge">Admin</span>
        </div>
        <div class="admin-nav hidden" id="headerNav">
            <span class="user-email" id="userDisplay"></span>
            <button class="btn-logout" id="logoutBtn">Atsijungti</button>
        </div>
    </header>

    <main>
        <div id="authSection" class="auth-container">
            <h1>Prisijungimas</h1>
            <div class="form-group">
                <input type="email" id="loginEmail" class="form-input" placeholder="dominikphotofficial.lt@gmail.com">
            </div>
            <div class="form-group">
                <input type="password" id="loginPass" class="form-input" placeholder="Slaptažodis">
            </div>
            <button id="loginBtn" class="btn-submit">Prisijungti</button>
            <p id="loginError" style="color: var(--danger-color); font-size: 0.8rem; margin-top: 15px; display: none;"></p>
        </div>

        <div id="dashSection" class="hidden">
            <nav class="tabs-header">
                <button class="tab-btn active" data-tab="galleriesTab">Galerijos (<span id="galleriesCount">0</span>)</button>
                <button class="tab-btn" data-tab="newGalleryTab">+ Nauja Galerija</button>
                <button class="tab-btn" data-tab="reviewsTab">Atsiliepimai (<span id="reviewsCount">0</span>)</button>
            </nav>

            <div id="galleriesTab" class="tab-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">Viso Galerijų</div>
                        <div class="stat-value" id="statTotalGalleries">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Viso Nuotraukų</div>
                        <div class="stat-value" id="statTotalPhotos">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Gauti Atsiliepimai</div>
                        <div class="stat-value" id="statTotalReviews">0</div>
                    </div>
                </div>

                <div class="toolbar">
                    <input type="text" id="searchInput" class="search-input" placeholder="Ieškoti pagal pavadinimą arba PIN...">
                </div>

                <div class="gallery-list" id="galleryList"></div>
            </div>

            <div id="newGalleryTab" class="tab-content hidden">
                <div class="form-card">
                    <form id="galleryForm">
                        <div class="form-group">
                            <label class="form-label">Galerijos pavadinimas</label>
                            <input type="text" id="gTitle" class="form-input" placeholder="Pvz. Porsche 911 GT3 RS Sesija" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Kategorija / Potėmė</label>
                            <input type="text" id="gSubtitle" class="form-input" placeholder="Pvz. Automobilių fotosesija — Kaunas" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">PIN kodas (6 skaitmenys)</label>
                            <input type="text" id="gPin" class="form-input" placeholder="123456" maxlength="6" pattern="[0-9]{6}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">ZIP Archyvo nuoroda</label>
                            <input type="url" id="gZip" class="form-input" placeholder="https://drive.google.com/...">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Nuotraukos</label>
                            <div class="drop-zone" id="dropZone">
                                <p id="dropText">Tempkite nuotraukas čia arba spustelėkite</p>
                                <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
                            </div>
                            <div class="preview-grid" id="previewGrid"></div>
                        </div>

                        <div class="progress-box" id="progressBox">
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" id="progressBar"></div>
                            </div>
                            <p class="progress-text" id="progressStatus">Įkeliama...</p>
                        </div>

                        <button type="submit" id="submitGalleryBtn" class="btn-submit">Sukurti ir įkelti galeriją</button>
                    </form>
                </div>
            </div>

            <div id="reviewsTab" class="tab-content hidden">
                <div class="reviews-list" id="reviewsList"></div>
            </div>
        </div>
    </main>

    <script type="module">
        import { auth, db, storage } from './firebase-config.js';
        import { signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { collection, getDocs, addDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ref, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const authSection = document.getElementById('authSection');
        const dashSection = document.getElementById('dashSection');
        const headerNav = document.getElementById('headerNav');
        const userDisplay = document.getElementById('userDisplay');
        const logoutBtn = document.getElementById('logoutBtn');
        const loginBtn = document.getElementById('loginBtn');
        const loginEmail = document.getElementById('loginEmail');
        const loginPass = document.getElementById('loginPass');
        const loginError = document.getElementById('loginError');

        const galleryList = document.getElementById('galleryList');
        const reviewsList = document.getElementById('reviewsList');
        const searchInput = document.getElementById('searchInput');

        const statTotalGalleries = document.getElementById('statTotalGalleries');
        const statTotalPhotos = document.getElementById('statTotalPhotos');
        const statTotalReviews = document.getElementById('statTotalReviews');
        const galleriesCount = document.getElementById('galleriesCount');
        const reviewsCount = document.getElementById('reviewsCount');

        let allGalleries = [];
        let allReviews = [];
        let selectedFiles = [];

        onAuthStateChanged(auth, async (user) => {
            if (user && user.email === 'dominikphotofficial.lt@gmail.com') {
                authSection.classList.add('hidden');
                dashSection.classList.remove('hidden');
                headerNav.classList.remove('hidden');
                userDisplay.innerText = user.email;
                await loadDashboardData();
            } else {
                authSection.classList.remove('hidden');
                dashSection.classList.add('hidden');
                headerNav.classList.add('hidden');
            }
        });

        loginBtn.addEventListener('click', async () => {
            const email = loginEmail.value.trim();
            const pass = loginPass.value;
            if (!email || !pass) return;

            loginBtn.innerText = "Jungiamasi...";
            loginBtn.disabled = true;
            try {
                await signInWithEmailAndPassword(auth, email, pass);
            } catch (e) {
                loginError.innerText = "Neteisingi prisijungimo duomenys";
                loginError.style.display = 'block';
            } finally {
                loginBtn.innerText = "Prisijungti";
                loginBtn.disabled = false;
            }
        });

        logoutBtn.addEventListener('click', () => signOut(auth));

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab).classList.remove('hidden');
            });
        });

        async function loadDashboardData() {
            const gSnap = await getDocs(query(collection(db, "galleries"), orderBy("date", "desc")));
            allGalleries = [];
            let totalPhotos = 0;

            gSnap.forEach(docSnap => {
                const item = { id: docSnap.id, ...docSnap.data() };
                allGalleries.push(item);
                totalPhotos += (item.photos ? item.photos.length : 0);
            });

            const rSnap = await getDocs(query(collection(db, "reviews"), orderBy("date", "desc")));
            allReviews = [];
            rSnap.forEach(docSnap => {
                allReviews.push({ id: docSnap.id, ...docSnap.data() });
            });

            statTotalGalleries.innerText = allGalleries.length;
            galleriesCount.innerText = allGalleries.length;
            statTotalPhotos.innerText = totalPhotos;
            statTotalReviews.innerText = allReviews.length;
            reviewsCount.innerText = allReviews.length;

            renderGalleries(allGalleries);
            renderReviews(allReviews);
        }

        function renderGalleries(list) {
            galleryList.innerHTML = '';
            if (list.length === 0) {
                galleryList.innerHTML = '<p style="text-align:center; padding:40px; opacity:0.5; text-transform:uppercase; letter-spacing:2px;">Galerijų nerasta</p>';
                return;
            }

            list.forEach(g => {
                const cover = (g.photos && g.photos.length > 0) ? g.photos[0].thumb : '';
                const count = g.photos ? g.photos.length : 0;
                const dateStr = g.date ? new Date(g.date).toLocaleDateString('lt-LT') : '—';

                const row = document.createElement('div');
                row.className = 'gallery-row';
                row.innerHTML = `
                    <img src="${cover}" class="gallery-thumb" alt="Cover">
                    <div class="gallery-info">
                        <h3>${g.title || 'Be pavadinimo'}</h3>
                        <p>${g.subtitle || ''}</p>
                    </div>
                    <div>
                        <span class="pin-pill" title="Nukopijuoti PIN" data-pin="${g.pin}">
                            PIN: ${g.pin}
                        </span>
                    </div>
                    <div class="meta-text">${count} nuotr.</div>
                    <div class="meta-text">${dateStr}</div>
                    <div class="row-actions">
                        <button class="action-icon-btn btn-open" title="Peržiūrėti kliento akimis">
                            <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                        <button class="action-icon-btn btn-delete" title="Ištrinti galeriją">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;

                row.querySelector('.pin-pill').onclick = () => {
                    navigator.clipboard.writeText(g.pin);
                    alert(`PIN kodas ${g.pin} nukopijuotas!`);
                };

                row.querySelector('.btn-open').onclick = () => {
                    sessionStorage.setItem('clientGallery', JSON.stringify(g));
                    window.open('/gallery.html', '_blank');
                };

                row.querySelector('.btn-delete').onclick = async () => {
                    if (confirm(`Ar tikrai norite ištrinti galeriją "${g.title}"?`)) {
                        await deleteDoc(doc(db, "galleries", g.id));
                        await loadDashboardData();
                    }
                };

                galleryList.appendChild(row);
            });
        }

        function renderReviews(list) {
            reviewsList.innerHTML = '';
            if (list.length === 0) {
                reviewsList.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:40px; opacity:0.5; text-transform:uppercase; letter-spacing:2px;">Atsiliepimų nėra</p>';
                return;
            }

            list.forEach(r => {
                const stars = '★'.repeat(r.rating || 5) + '☆'.repeat(5 - (r.rating || 5));
                const dateStr = r.date ? new Date(r.date).toLocaleDateString('lt-LT') : '';

                const card = document.createElement('div');
                card.className = 'review-card';
                card.innerHTML = `
                    <div>
                        <div class="review-header">
                            <div class="review-author">${r.name || 'Anonimas'}</div>
                            <div class="review-stars">${stars}</div>
                        </div>
                        <div class="review-gallery">${r.galleryTitle || ''}</div>
                        <div class="review-body">"${r.text || ''}"</div>
                    </div>
                    <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-color); padding-top:12px;">
                        <span class="review-date">${dateStr}</span>
                        <button class="action-icon-btn btn-delete" title="Ištrinti atsiliepimą" style="width:30px; height:30px;">
                            <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                        </button>
                    </div>
                `;

                card.querySelector('.btn-delete').onclick = async () => {
                    if (confirm("Ištrinti šį atsiliepimą?")) {
                        await deleteDoc(doc(db, "reviews", r.id));
                        await loadDashboardData();
                    }
                };

                reviewsList.appendChild(card);
            });
        }

        searchInput.addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase().trim();
            const filtered = allGalleries.filter(g => 
                (g.title && g.title.toLowerCase().includes(val)) ||
                (g.subtitle && g.subtitle.toLowerCase().includes(val)) ||
                (g.pin && g.pin.includes(val))
            );
            renderGalleries(filtered);
        });

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('previewGrid');
        const dropText = document.getElementById('dropText');
        const galleryForm = document.getElementById('galleryForm');
        const submitGalleryBtn = document.getElementById('submitGalleryBtn');
        const progressBox = document.getElementById('progressBox');
        const progressBar = document.getElementById('progressBar');
        const progressStatus = document.getElementById('progressStatus');

        dropZone.onclick = () => fileInput.click();

        ['dragenter', 'dragover'].forEach(ev => {
            dropZone.addEventListener(ev, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
        });

        ['dragleave', 'drop'].forEach(ev => {
            dropZone.addEventListener(ev, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            });
        });

        dropZone.addEventListener('drop', (e) => {
            const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
            addFiles(files);
        });

        fileInput.addEventListener('change', (e) => {
            addFiles(Array.from(e.target.files));
        });

        function addFiles(files) {
            selectedFiles = [...selectedFiles, ...files];
            previewGrid.innerHTML = '';
            dropText.innerText = `Pasirinkta nuotraukų: ${selectedFiles.length}`;
            selectedFiles.forEach(file => {
                const img = document.createElement('img');
                img.src = URL.createObjectURL(file);
                previewGrid.appendChild(img);
            });
        }

        galleryForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pin = document.getElementById('gPin').value.trim();
            const title = document.getElementById('gTitle').value.trim();
            const subtitle = document.getElementById('gSubtitle').value.trim();
            const zip = document.getElementById('gZip').value.trim();

            if (selectedFiles.length === 0 || pin.length !== 6) return alert("Patikrinkite duomenis");

            submitGalleryBtn.disabled = true;
            progressBox.style.display = 'block';

            const uploadedPhotos = [];

            try {
                for (let i = 0; i < selectedFiles.length; i++) {
                    const file = selectedFiles[i];
                    const storageRef = ref(storage, `galleries/${pin}/${file.name}`);
                    const uploadTask = uploadBytesResumable(storageRef, file);

                    await new Promise((resolve, reject) => {
                        uploadTask.on('state_changed', 
                            (snap) => {
                                const percent = ((i + (snap.bytesTransferred / snap.totalBytes)) / selectedFiles.length) * 100;
                                progressBar.style.width = `${percent}%`;
                                progressStatus.innerText = `Keliama: ${i + 1} iš ${selectedFiles.length} (${Math.round(percent)}%)`;
                            },
                            (err) => reject(err),
                            async () => {
                                const url = await getDownloadURL(uploadTask.snapshot.ref);
                                uploadedPhotos.push({ thumb: url, full: url });
                                resolve();
                            }
                        );
                    });
                }

                await addDoc(collection(db, "galleries"), {
                    title,
                    subtitle,
                    pin,
                    zip_url: zip || null,
                    photos: uploadedPhotos,
                    date: new Date().toISOString()
                });

                alert("Galerija sėkmingai sukurta!");
                galleryForm.reset();
                selectedFiles = [];
                previewGrid.innerHTML = '';
                dropText.innerText = "Tempkite nuotraukas čia arba spustelėkite";
                progressBox.style.display = 'none';
                submitGalleryBtn.disabled = false;

                document.querySelector('[data-tab="galleriesTab"]').click();
                await loadDashboardData();

            } catch (error) {
                alert("Klaida įkeliant nuotraukas.");
                submitGalleryBtn.disabled = false;
                progressBox.style.display = 'none';
            }
        });
    </script>
</body>
</html>
