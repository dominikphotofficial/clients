<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DP.PORTFOLIO | KLIENTŲ PORTALAS</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/Xvc3zYGK/dp-logo.png">
    <link rel="apple-touch-icon" href="https://i.postimg.cc/Xvc3zYGK/dp-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500;600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 42vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 24px;
            background: var(--accent-color);
            color: #FFFFFF;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.35;
            transform: scale(1.04);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 850px;
        }

        .hero-badge {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.85;
            margin-bottom: 12px;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 6vw, 3.6rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            font-weight: 300;
            line-height: 1.15;
            margin-bottom: 14px;
        }

        .hero-date {
            font-size: 0.85rem;
            letter-spacing: 2px;
            opacity: 0.75;
            text-transform: uppercase;
        }

        .story-card {
            max-width: 850px;
            margin: 0 auto 50px auto;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            padding: clamp(25px, 5vw, 45px);
            text-align: center;
            box-shadow: 0 10px 40px rgba(17, 57, 57, 0.02);
            border-radius: var(--radius);
        }

        .story-text {
            font-size: clamp(0.95rem, 2vw, 1.05rem);
            line-height: 1.8;
            color: var(--text-color);
            white-space: pre-line;
            font-weight: 300;
        }

        .story-signature {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-top: 25px;
            font-weight: 500;
        }

        .filter-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .filter-tabs {
            display: flex;
            gap: 10px;
        }

        .filter-tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.8rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--radius);
        }

        .filter-tab-btn.active {
            color: var(--accent-color);
            font-weight: 600;
            background: var(--accent-soft);
        }

        .btn-copy-favs {
            display: none;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 14px;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: var(--transition);
            border-radius: var(--radius);
        }

        .btn-copy-favs:hover {
            background: var(--accent-color);
            color: #FFFFFF;
        }

        .review-card-section {
            max-width: 680px;
            margin: 40px auto 0 auto;
            background: var(--surface-color);
            padding: clamp(30px, 5vw, 55px);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(17, 57, 57, 0.03);
            border-radius: var(--radius);
        }

        .review-card-section h2 {
            text-align: center;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.3rem;
            margin-bottom: 25px;
            font-weight: 400;
        }

        .stars-selector {
            display: flex;
            gap: 6px;
            cursor: pointer;
            margin-top: 6px;
        }

        .stars-selector svg {
            width: 26px;
            height: 26px;
            fill: #D5D0C8;
            transition: fill 0.2s ease, transform 0.2s ease;
        }

        .stars-selector svg.active,
        .stars-selector svg.hover {
            fill: var(--gold-color);
        }

        .stars-selector svg:hover {
            transform: scale(1.15);
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="header-brand">
            <img src="https://i.postimg.cc/Xvc3zYGK/dp-logo.png" alt="DP.PORTFOLIO" class="header-logo">
            <span class="header-title-badge">KLIENTŲ PORTALAS</span>
        </a>
        <div class="header-actions">
            <a id="downloadArchiveBtn" href="#" class="btn-action" style="display: none;" target="_blank" download>
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                <span>Atsisiųsti archyvą (.zip)</span>
            </a>
            <button id="logoutGalleryBtn" class="btn-action btn-exit" title="Išeiti">
                <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.89-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <section class="hero-section">
        <img src="" id="heroCoverImg" class="hero-bg" alt="Cover">
        <div class="hero-content">
            <div class="hero-badge" id="heroCategory"></div>
            <h1 class="hero-title" id="heroTitle"></h1>
            <div class="hero-date" id="heroDate"></div>
        </div>
    </section>

    <main class="container">
        <div class="story-card" id="storyBox" style="display: none;">
            <div class="story-text" id="storyText"></div>
            <div class="story-signature">DP.PORTFOLIO</div>
        </div>

        <div class="filter-bar">
            <div class="filter-tabs">
                <button class="filter-tab-btn active" id="tabAll">Visi kadrai (<span id="countAll">0</span>)</button>
                <button class="filter-tab-btn" id="tabFavs">Mėgstamiausi (<span id="countFavs">0</span>)</button>
            </div>
            <button class="btn-copy-favs" id="copyFavsBtn">
                <svg viewBox="0 0 24 24" style="width:14px; height:14px; fill:currentColor;"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                <span>Kopijuoti atrinktų sąrašą</span>
            </button>
        </div>

        <section class="photo-grid" id="photoGrid"></section>

        <section class="review-card-section">
            <h2>Palikite atsiliepimą</h2>
            <form id="reviewForm">
                <div class="form-group">
                    <label class="form-label" for="reviewName">Jūsų vardas</label>
                    <input type="text" id="reviewName" class="form-input" placeholder="Vardas Pavardė" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Įvertinimas</label>
                    <div class="stars-selector" id="starsWrapper">
                        <svg data-val="1" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-val="2" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-val="3" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-val="4" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-val="5" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="reviewText">Atsiliepimas</label>
                    <textarea id="reviewText" class="form-input" placeholder="Pasidalinkite savo įspūdžiais apie fotosesiją..." required></textarea>
                </div>

                <button type="submit" id="reviewSubmitBtn" class="btn-primary">
                    <span>Išsiųsti atsiliepimą</span>
                </button>
            </form>

            <div id="reviewSuccessBox" style="display:none; text-align:center; padding:20px 0;">
                <h3 style="font-family:var(--font-heading); text-transform:uppercase; letter-spacing:2px; margin-bottom:8px;">Ačiū už jūsų įvertinimą!</h3>
                <p style="font-size:0.9rem; color:var(--text-muted);">Atsiliepimas sėkmingai išsiųstas.</p>
            </div>
        </section>
    </main>

    <div class="lightbox-modal" id="lbModal">
        <div class="lightbox-top">
            <span class="lightbox-idx" id="lbCounter">1 / 1</span>
            <div class="lightbox-actions">
                <button class="lb-btn" id="lbHeartBtn" title="Pažymėti širdele">
                    <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                </button>
                <a href="#" id="lbDownloadBtn" class="lb-btn" title="Atsisiųsti nuotrauką" target="_blank" download>
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </a>
                <button class="lb-btn" id="lbCloseBtn" title="Uždaryti">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
        </div>

        <button class="lb-nav prev" id="lbPrevBtn" aria-label="Atgal">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <div class="lb-stage">
            <img src="" id="lbDisplayImg" alt="Kadras">
        </div>

        <button class="lb-nav next" id="lbNextBtn" aria-label="Pirmyn">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <footer>
        <p>DP.PORTFOLIO &copy; 2026. Visos teisės saugomos.</p>
    </footer>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const raw = sessionStorage.getItem('clientGallery');
        if (!raw) {
            window.location.replace('index.html');
        }

        const data = JSON.parse(raw);
        const galleryKey = `dp_favs_${data.pin || 'default'}`;
        let favorites = JSON.parse(localStorage.getItem(galleryKey) || '[]');
        let currentFilter = 'all';

        document.getElementById('heroTitle').innerText = data.title || 'Galerija';
        document.getElementById('heroCategory').innerText = data.subtitle || data.category || 'Fotosesija';

        const photos = data.photos || [];
        const dateStr = data.date ? new Date(data.date).toLocaleDateString('lt-LT', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        }) : '';
        document.getElementById('heroDate').innerText = `${photos.length} KADRŲ ${dateStr ? '• ' + dateStr : ''}`;

        if (photos.length > 0) {
            const heroCover = document.getElementById('heroCoverImg');
            heroCover.src = photos[0].full || photos[0].thumb;
            heroCover.style.display = 'block';
        }

        if (data.description && data.description.trim()) {
            document.getElementById('storyText').innerText = data.description;
            document.getElementById('storyBox').style.display = 'block';
        }

        const zipBtn = document.getElementById('downloadArchiveBtn');
        if (data.zip_url) {
            zipBtn.href = data.zip_url;
            zipBtn.style.display = 'inline-flex';
        }

        document.getElementById('logoutGalleryBtn').addEventListener('click', () => {
            sessionStorage.removeItem('clientGallery');
            window.location.replace('index.html');
        });

        const grid = document.getElementById('photoGrid');
        const countAll = document.getElementById('countAll');
        const countFavs = document.getElementById('countFavs');
        const tabAll = document.getElementById('tabAll');
        const tabFavs = document.getElementById('tabFavs');
        const copyFavsBtn = document.getElementById('copyFavsBtn');

        function updateFavoritesBadge() {
            countAll.innerText = photos.length;
            countFavs.innerText = favorites.length;
            localStorage.setItem(galleryKey, JSON.stringify(favorites));
            copyFavsBtn.style.display = favorites.length > 0 ? 'inline-flex' : 'none';
        }

        updateFavoritesBadge();

        tabAll.addEventListener('click', () => {
            currentFilter = 'all';
            tabAll.classList.add('active');
            tabFavs.classList.remove('active');
            renderGrid();
        });

        tabFavs.addEventListener('click', () => {
            currentFilter = 'favs';
            tabFavs.classList.add('active');
            tabAll.classList.remove('active');
            renderGrid();
        });

        copyFavsBtn.addEventListener('click', () => {
            if (favorites.length === 0) return;
            const text = `Kliento atrinkti kadrai (${data.title}):\n` + favorites.map((f, i) => `${i + 1}. ${f}`).join('\n');
            navigator.clipboard.writeText(text);
            alert(`Atrinktų nuotraukų sąrašas nukopijuotas (${favorites.length} vnt.)!`);
        });

        let activeDisplayPhotos = [];
        let currentIdx = 0;

        function renderGrid() {
            grid.innerHTML = '';
            activeDisplayPhotos = currentFilter === 'all' 
                ? photos 
                : photos.filter(p => favorites.includes(p.full || p.thumb));

            if (activeDisplayPhotos.length === 0) {
                grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding:50px; opacity:0.5; text-transform:uppercase; letter-spacing:2px;">Nuotraukų nerasta</p>';
                return;
            }

            activeDisplayPhotos.forEach((p, idx) => {
                const isFav = favorites.includes(p.full || p.thumb);
                const card = document.createElement('div');
                card.className = 'photo-card';
                card.innerHTML = `
                    <button class="fav-heart-btn ${isFav ? 'active' : ''}" title="Mėgstamiausia">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                    <img src="${p.thumb}" loading="lazy" alt="Kadras">
                    <div class="photo-hover-overlay">
                        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    </div>
                `;

                card.querySelector('.fav-heart-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(p.full || p.thumb);
                });

                card.addEventListener('click', () => showLightbox(idx));
                grid.appendChild(card);
            });
        }

        function toggleFavorite(photoUrl) {
            if (favorites.includes(photoUrl)) {
                favorites = favorites.filter(u => u !== photoUrl);
            } else {
                favorites.push(photoUrl);
            }
            updateFavoritesBadge();
            renderGrid();
            updateLightboxHeart();
        }

        renderGrid();

        const lbModal = document.getElementById('lbModal');
        const lbDisplayImg = document.getElementById('lbDisplayImg');
        const lbCounter = document.getElementById('lbCounter');
        const lbDownloadBtn = document.getElementById('lbDownloadBtn');
        const lbHeartBtn = document.getElementById('lbHeartBtn');
        const lbCloseBtn = document.getElementById('lbCloseBtn');
        const lbPrevBtn = document.getElementById('lbPrevBtn');
        const lbNextBtn = document.getElementById('lbNextBtn');

        function showLightbox(idx) {
            currentIdx = idx;
            renderLightbox();
            lbModal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function hideLightbox() {
            lbModal.classList.remove('active');
            document.body.style.overflow = '';
        }

        function renderLightbox() {
            const p = activeDisplayPhotos[currentIdx];
            if (!p) return;

            lbCounter.innerText = `${currentIdx + 1} / ${activeDisplayPhotos.length}`;
            lbDownloadBtn.href = p.full || p.thumb;
            updateLightboxHeart();

            lbDisplayImg.style.opacity = '0';
            const cacheImg = new Image();
            cacheImg.src = p.full || p.thumb;
            cacheImg.onload = () => {
                lbDisplayImg.src = cacheImg.src;
                lbDisplayImg.style.opacity = '1';
            };
        }

        function updateLightboxHeart() {
            const p = activeDisplayPhotos[currentIdx];
            if (!p) return;
            const isFav = favorites.includes(p.full || p.thumb);
            lbHeartBtn.classList.toggle('heart-active', isFav);
        }

        lbHeartBtn.addEventListener('click', () => {
            const p = activeDisplayPhotos[currentIdx];
            if (p) toggleFavorite(p.full || p.thumb);
        });

        function nextPhoto() {
            if (!activeDisplayPhotos.length) return;
            currentIdx = (currentIdx + 1) % activeDisplayPhotos.length;
            renderLightbox();
        }

        function prevPhoto() {
            if (!activeDisplayPhotos.length) return;
            currentIdx = (currentIdx - 1 + activeDisplayPhotos.length) % activeDisplayPhotos.length;
            renderLightbox();
        }

        lbCloseBtn.addEventListener('click', hideLightbox);
        lbNextBtn.addEventListener('click', nextPhoto);
        lbPrevBtn.addEventListener('click', prevPhoto);

        lbModal.addEventListener('click', (e) => {
            if (e.target === lbModal || e.target.classList.contains('lb-stage')) {
                hideLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!lbModal.classList.contains('active')) return;
            if (e.key === 'Escape') hideLightbox();
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft') prevPhoto();
        });

        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        lbModal.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        lbModal.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            const deltaX = touchEndX - touchStartX;
            const deltaY = touchEndY - touchStartY;

            if (Math.abs(deltaX) > Math.abs(deltaY)) {
                if (deltaX < -50) nextPhoto();
                if (deltaX > 50) prevPhoto();
            } else {
                if (deltaY > 80) hideLightbox();
            }
        }, { passive: true });

        let currentRating = 5;
        const starNodes = document.querySelectorAll('#starsWrapper svg');

        starNodes.forEach((s) => {
            s.addEventListener('mouseenter', () => {
                const val = parseInt(s.dataset.val);
                starNodes.forEach(node => {
                    node.classList.toggle('hover', parseInt(node.dataset.val) <= val);
                });
            });

            s.addEventListener('mouseleave', () => {
                starNodes.forEach(node => node.classList.remove('hover'));
            });

            s.addEventListener('click', () => {
                currentRating = parseInt(s.dataset.val);
                starNodes.forEach(node => {
                    node.classList.toggle('active', parseInt(node.dataset.val) <= currentRating);
                });
            });
        });

        const reviewForm = document.getElementById('reviewForm');
        const reviewSubmitBtn = document.getElementById('reviewSubmitBtn');
        const reviewSuccessBox = document.getElementById('reviewSuccessBox');

        reviewForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reviewName').value.trim();
            const text = document.getElementById('reviewText').value.trim();

            if (!name || !text) return;

            reviewSubmitBtn.disabled = true;
            reviewSubmitBtn.querySelector('span').innerText = 'Siunčiama...';

            try {
                await addDoc(collection(db, "reviews"), {
                    galleryTitle: data.title || '',
                    name: name,
                    rating: currentRating,
                    text: text,
                    status: 'pending',
                    date: new Date().toISOString()
                });

                reviewForm.style.display = 'none';
                reviewSuccessBox.style.display = 'block';
            } catch (err) {
                alert('Klaida siunčiant atsiliepimą.');
                reviewSubmitBtn.disabled = false;
                reviewSubmitBtn.querySelector('span').innerText = 'Išsiųsti atsiliepimą';
            }
        });
    </script>
</body>
</html>
