<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerija — DP.PORTFOLIO</title>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FBF9F6;
            --surface-color: #FFFFFF;
            --secondary-color: #D4C3B3;
            --accent-color: #113939;
            --accent-light: #2A5C5C;
            --text-color: #1A2B2B;
            --font-heading: 'Jost', sans-serif;
            --font-body: 'Josefin Sans', sans-serif;
            --border-color: rgba(17, 57, 57, 0.08);
            --cb: cubic-bezier(0.16, 1, 0.3, 1);
            --transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: var(--font-body);
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 5vw;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(251, 249, 246, 0.94);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .header-logo {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .header-logo img {
            height: clamp(26px, 4vw, 34px);
            width: auto;
            display: block;
            transition: transform 0.4s var(--cb), opacity 0.4s var(--cb);
        }

        .header-logo img:hover {
            opacity: 0.8;
            transform: scale(1.03);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.75rem;
            text-decoration: none;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-action svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
            transition: transform 0.3s var(--cb);
        }

        .btn-action:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .btn-action:hover svg {
            transform: translateY(1px);
        }

        .btn-logout {
            border: 1px solid var(--border-color);
            color: rgba(26, 43, 43, 0.6);
            padding: 10px 14px;
        }

        .btn-logout:hover {
            background: rgba(17, 57, 57, 0.05);
            color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .container {
            max-width: 1700px;
            margin: 0 auto;
            padding: 140px 4vw 80px 4vw;
        }

        .gallery-intro {
            text-align: center;
            max-width: 800px;
            margin: 0 auto 70px auto;
        }

        .gallery-intro h1 {
            font-family: var(--font-heading);
            font-size: clamp(2rem, 5vw, 3.5rem);
            text-transform: uppercase;
            letter-spacing: 6px;
            font-weight: 300;
            line-height: 1.2;
            margin-bottom: 12px;
            color: var(--text-color);
        }

        .gallery-intro p {
            font-size: clamp(0.85rem, 2vw, 1.05rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--accent-light);
            font-weight: 400;
        }

        .divider {
            width: 50px;
            height: 1px;
            background-color: var(--accent-color);
            margin: 25px auto 0 auto;
        }

        .gallery-grid {
            column-count: 3;
            column-gap: 25px;
            padding-bottom: 60px;
        }

        .gallery-item {
            position: relative;
            break-inside: avoid;
            margin-bottom: 25px;
            cursor: pointer;
            overflow: hidden;
            background: #e8e6e3;
            box-shadow: 0 10px 30px rgba(17, 57, 57, 0.04);
        }

        .gallery-item img {
            width: 100%;
            display: block;
            transition: transform 0.9s var(--cb);
        }

        .item-overlay {
            position: absolute;
            inset: 0;
            background: rgba(17, 57, 57, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.4s var(--cb);
        }

        .item-overlay svg {
            width: 32px;
            height: 32px;
            fill: #FFFFFF;
            transform: scale(0.8);
            transition: transform 0.4s var(--cb);
        }

        .gallery-item:hover img {
            transform: scale(1.04);
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }

        .gallery-item:hover .item-overlay svg {
            transform: scale(1);
        }

        .review-section {
            max-width: 700px;
            margin: 60px auto 0 auto;
            background: var(--surface-color);
            padding: 50px clamp(25px, 5vw, 60px);
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(17, 57, 57, 0.03);
        }

        .review-title {
            text-align: center;
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 1.4rem;
            margin-bottom: 30px;
            font-weight: 400;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .field-label {
            display: block;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-color);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(17, 57, 57, 0.2);
            font-family: var(--font-body);
            font-size: 1rem;
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s var(--cb);
            resize: vertical;
        }

        .form-input:focus {
            border-bottom-color: var(--accent-color);
        }

        .star-rating {
            display: flex;
            gap: 8px;
            margin-top: 5px;
            cursor: pointer;
        }

        .star-rating svg {
            width: 24px;
            height: 24px;
            fill: #dcd7d0;
            transition: fill 0.2s ease, transform 0.2s ease;
        }

        .star-rating svg.active,
        .star-rating svg.hover {
            fill: var(--accent-color);
        }

        .star-rating svg:hover {
            transform: scale(1.15);
        }

        .btn-submit-review {
            width: 100%;
            margin-top: 20px;
            padding: 18px;
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit-review svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .btn-submit-review:hover {
            background: var(--accent-color);
            color: var(--bg-color);
        }

        .review-success-card {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .review-success-card svg {
            width: 40px;
            height: 40px;
            fill: var(--accent-color);
            margin-bottom: 15px;
        }

        .review-success-card h3 {
            font-family: var(--font-heading);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.2rem;
            margin-bottom: 10px;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(10, 15, 15, 0.97);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s var(--cb);
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-topbar {
            position: absolute;
            top: 25px;
            left: 30px;
            right: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #FFFFFF;
            z-index: 2002;
        }

        .lightbox-counter {
            font-family: var(--font-heading);
            letter-spacing: 3px;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        .lightbox-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .lb-icon-btn {
            background: none;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.3s var(--cb), color 0.3s var(--cb);
            text-decoration: none;
        }

        .lb-icon-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .lb-icon-btn:hover {
            color: var(--secondary-color);
            transform: scale(1.1);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #FFFFFF;
            cursor: pointer;
            padding: 25px;
            z-index: 2002;
            transition: transform 0.3s var(--cb), color 0.3s var(--cb);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lightbox-nav svg {
            width: 28px;
            height: 28px;
            fill: currentColor;
        }

        .lightbox-nav:hover {
            color: var(--secondary-color);
            transform: translateY(-50%) scale(1.15);
        }

        .lightbox-nav.prev {
            left: 15px;
        }

        .lightbox-nav.next {
            right: 15px;
        }

        .lightbox-stage {
            max-width: 90vw;
            max-height: 88vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .lightbox-stage img {
            max-width: 100%;
            max-height: 88vh;
            object-fit: contain;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transition: opacity 0.25s var(--cb), transform 0.3s var(--cb);
        }

        footer {
            text-align: center;
            padding: 50px 20px;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
        }

        footer p {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            letter-spacing: 4px;
            color: rgba(26, 43, 43, 0.6);
            text-transform: uppercase;
        }

        @media (max-width: 1024px) {
            .gallery-grid {
                column-count: 2;
                column-gap: 15px;
            }
            .gallery-item {
                margin-bottom: 15px;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }
            .btn-action span {
                display: none;
            }
            .btn-action {
                padding: 10px;
            }
            .gallery-grid {
                column-count: 1;
            }
            .lightbox-nav.prev {
                left: 5px;
            }
            .lightbox-nav.next {
                right: 5px;
            }
            .lightbox-nav {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="header-logo">
            <img src="https://i.postimg.cc/Xvc3zYGK/dp-logo.png" alt="DP.PORTFOLIO">
        </a>
        <div class="header-actions">
            <a id="zipDownloadBtn" href="#" class="btn-action" style="display: none;" target="_blank" download>
                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                <span>Atsisiųsti archyvą (.zip)</span>
            </a>
            <button id="exitGalleryBtn" class="btn-action btn-logout" title="Atsijungti">
                <svg viewBox="0 0 24 24"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.89-2-2-2z"/></svg>
            </button>
        </div>
    </header>

    <main class="container">
        <section class="gallery-intro">
            <h1 id="galleryTitle">Kraunama...</h1>
            <p id="gallerySubtitle"></p>
            <div class="divider"></div>
        </section>

        <section class="gallery-grid" id="galleryGrid"></section>

        <section class="review-section">
            <h2 class="review-title">Palikite atsiliepimą</h2>
            <form id="reviewForm">
                <div class="form-group">
                    <label class="field-label">Jūsų vardas</label>
                    <input type="text" id="reviewName" class="form-input" placeholder="Vardas Pavardė" required>
                </div>

                <div class="form-group">
                    <label class="field-label">Įvertinimas</label>
                    <div class="star-rating" id="starRating">
                        <svg data-val="1" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-val="2" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-val="3" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-val="4" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                        <svg data-val="5" viewBox="0 0 24 24" class="active"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
                    </div>
                </div>

                <div class="form-group">
                    <label class="field-label">Jūsų atsiliepimas</label>
                    <textarea id="reviewText" class="form-input" rows="3" placeholder="Pasidalinkite savo įspūdžiais apie fotosesiją..." required></textarea>
                </div>

                <button type="submit" id="submitReviewBtn" class="btn-submit-review">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                    <span>Išsiųsti atsiliepimą</span>
                </button>
            </form>

            <div id="reviewSuccess" class="review-success-card">
                <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                <h3>Ačiū už jūsų įvertinimą!</h3>
                <p>Jūsų atsiliepimas sėkmingai išsiųstas moderavimui.</p>
            </div>
        </section>
    </main>

    <div class="lightbox" id="lightboxModal">
        <div class="lightbox-topbar">
            <span class="lightbox-counter" id="lbCounter">1 / 1</span>
            <div class="lightbox-controls">
                <a href="#" id="lbDownloadSingle" class="lb-icon-btn" title="Atsisiųsti nuotrauką" target="_blank" download>
                    <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                </a>
                <button class="lb-icon-btn" id="lbCloseBtn" title="Uždaryti">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
        </div>

        <button class="lightbox-nav prev" id="lbPrevBtn">
            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <div class="lightbox-stage">
            <img src="" id="lbImage" alt="Gallery Photo">
        </div>

        <button class="lightbox-nav next" id="lbNextBtn">
            <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
    </div>

    <footer>
        <p>DP.PORTFOLIO &copy; 2026. Visos teisės saugomos.</p>
    </footer>

    <script type="module">
        import { db } from './firebase-config.js';
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const sessionRaw = sessionStorage.getItem('clientGallery');
        if (!sessionRaw) {
            window.location.replace('index.html');
        }

        const gallery = JSON.parse(sessionRaw);

        document.getElementById('galleryTitle').innerText = gallery.title || 'Galerija';
        document.getElementById('gallerySubtitle').innerText = gallery.subtitle || '';

        const zipBtn = document.getElementById('zipDownloadBtn');
        if (gallery.zip_url) {
            zipBtn.href = gallery.zip_url;
            zipBtn.style.display = 'inline-flex';
        }

        document.getElementById('exitGalleryBtn').addEventListener('click', () => {
            sessionStorage.removeItem('clientGallery');
            window.location.replace('index.html');
        });

        const grid = document.getElementById('galleryGrid');
        const photos = gallery.photos || [];
        let currentIndex = 0;

        photos.forEach((photo, idx) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
                <img src="${photo.thumb}" loading="lazy" alt="Photo ${idx + 1}">
                <div class="item-overlay">
                    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                </div>
            `;
            item.addEventListener('click', () => openLightbox(idx));
            grid.appendChild(item);
        });

        const lightbox = document.getElementById('lightboxModal');
        const lbImage = document.getElementById('lbImage');
        const lbCounter = document.getElementById('lbCounter');
        const lbDownloadSingle = document.getElementById('lbDownloadSingle');
        const lbCloseBtn = document.getElementById('lbCloseBtn');
        const lbPrevBtn = document.getElementById('lbPrevBtn');
        const lbNextBtn = document.getElementById('lbNextBtn');

        function openLightbox(index) {
            currentIndex = index;
            updateLightbox();
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
        }

        function updateLightbox() {
            const photo = photos[currentIndex];
            if (!photo) return;

            lbCounter.innerText = `${currentIndex + 1} / ${photos.length}`;
            lbDownloadSingle.href = photo.full || photo.thumb;

            lbImage.style.opacity = '0';
            const temp = new Image();
            temp.src = photo.full || photo.thumb;
            temp.onload = () => {
                lbImage.src = temp.src;
                lbImage.style.opacity = '1';
            };
        }

        function nextPhoto() {
            if (!photos.length) return;
            currentIndex = (currentIndex + 1) % photos.length;
            updateLightbox();
        }

        function prevPhoto() {
            if (!photos.length) return;
            currentIndex = (currentIndex - 1 + photos.length) % photos.length;
            updateLightbox();
        }

        lbCloseBtn.addEventListener('click', closeLightbox);
        lbNextBtn.addEventListener('click', nextPhoto);
        lbPrevBtn.addEventListener('click', prevPhoto);

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox || e.target.classList.contains('lightbox-stage')) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return;
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowRight') nextPhoto();
            if (e.key === 'ArrowLeft') prevPhoto();
        });

        let selectedRating = 5;
        const starEls = document.querySelectorAll('#starRating svg');

        starEls.forEach((star) => {
            star.addEventListener('mouseenter', () => {
                const val = parseInt(star.dataset.val);
                starEls.forEach((s) => {
                    s.classList.toggle('hover', parseInt(s.dataset.val) <= val);
                });
            });

            star.addEventListener('mouseleave', () => {
                starEls.forEach((s) => s.classList.remove('hover'));
            });

            star.addEventListener('click', () => {
                selectedRating = parseInt(star.dataset.val);
                starEls.forEach((s) => {
                    s.classList.toggle('active', parseInt(s.dataset.val) <= selectedRating);
                });
            });
        });

        const reviewForm = document.getElementById('reviewForm');
        const submitReviewBtn = document.getElementById('submitReviewBtn');
        const reviewSuccess = document.getElementById('reviewSuccess');

        reviewForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('reviewName').value.trim();
            const text = document.getElementById('reviewText').value.trim();

            if (!name || !text) return;

            submitReviewBtn.disabled = true;
            submitReviewBtn.querySelector('span').innerText = 'Siunčiama...';

            try {
                await addDoc(collection(db, "reviews"), {
                    galleryTitle: gallery.title || '',
                    name: name,
                    rating: selectedRating,
                    text: text,
                    status: 'pending',
                    date: new Date().toISOString()
                });

                reviewForm.style.display = 'none';
                reviewSuccess.style.display = 'block';
            } catch (err) {
                alert('Klaida siunčiant atsiliepimą. Bandykite dar kartą.');
                submitReviewBtn.disabled = false;
                submitReviewBtn.querySelector('span').innerText = 'Išsiųsti atsiliepimą';
            }
        });
    </script>
</body>
</html>
