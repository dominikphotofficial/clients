<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <title>DP.PORTFOLIO</title>
    <script>
        const path = window.location.pathname.replace(/^\//, '').replace(/\/$/, '');
        if (path === 'gallery') {
            window.location.replace('/gallery.html');
        } else if (path === 'admin') {
            window.location.replace('/admin.html');
        } else {
            window.location.replace('/index.html');
        }
    </script>
</head>
